workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "demo/merchant-enrichment" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "main" && $DEMO_PROMOTE_SHA'
    - when: never

stages: [validate, package, performance, promote]

default:
  tags: [aca-demo]
  interruptible: false
  before_script:
    - export AZURE_CONFIG_DIR="$CI_PROJECT_DIR/.azure-$CI_JOB_ID"
    - export PYTHONUNBUFFERED=1

variables:
  GIT_DEPTH: "0"
  GIT_STRATEGY: clone
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

.mr_only:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

functional_tests:
  extends: .mr_only
  stage: validate
  timeout: 5m
  script:
    - python -m unittest discover -s tests -v

candidate_artifact:
  extends: .mr_only
  stage: package
  timeout: 5m
  script:
    - python -m tools.gitlab_demo.pipeline build
  artifacts:
    expire_in: 30 days
    paths: [dist/candidate.zip, dist/candidate.json]

# One lock covers the WHOLE deploy -> SHA -> reset/warm -> load -> evidence interval.
performance_gate:
  extends: .mr_only
  stage: performance
  timeout: 40m
  variables:
    RUNNER_SCRIPT_TIMEOUT: 35m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 3m
  resource_group: contoso-gitlab-demo-staging
  needs: [functional_tests, candidate_artifact]
  script:
    - python -m tools.gitlab_demo.pipeline gate
  artifacts:
    when: always
    expire_in: 30 days
    paths: [demo-evidence/, dist/candidate.json, dist/candidate.zip]

promote_tested_slot:
  stage: promote
  timeout: 25m
  variables:
    RUNNER_SCRIPT_TIMEOUT: 20m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 3m
  resource_group: contoso-gitlab-demo-staging
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "main" && $DEMO_PROMOTE_SHA'
  script:
    - python -m tools.gitlab_demo.pipeline promote
  artifacts:
    when: always
    expire_in: 30 days
    paths: [demo-evidence/]
