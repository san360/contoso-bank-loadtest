#cloud-config
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - nfs-common
write_files:
  - path: /usr/local/sbin/check-gitlab-disk
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      path=${1:-/srv/gitlab}
      mountpoint -q "$path"
      test "$(findmnt -n -o FSTYPE --target "$path")" = ext4
      test "$(findmnt -n -o UUID --target "$path")" = "$(cat /etc/gitlab-data.uuid)"
  - path: /etc/apt/apt.conf.d/99gitlab-no-auto-reboot
    permissions: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
  - path: /usr/local/sbin/prepare-gitlab-disk
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      disk=/dev/disk/azure/scsi1/lun0
      for attempt in $(seq 1 120); do
        if [ -b "$disk" ]; then break; fi
        sleep 5
      done
      test -b "$disk"
      if ! blkid "$disk" >/dev/null 2>&1; then
        mkfs.ext4 -L gitlab-data "$disk"
      fi
      test "$(blkid -s TYPE -o value "$disk")" = ext4
      uuid=$(blkid -s UUID -o value "$disk")
      mkdir -p /srv/gitlab
      if ! grep -Fq "UUID=$uuid " /etc/fstab; then
        printf 'UUID=%s /srv/gitlab ext4 defaults 0 2\n' "$uuid" >> /etc/fstab
      fi
      if ! mountpoint -q /srv/gitlab; then mount /srv/gitlab; fi
      printf '%s\n' "$uuid" > /etc/gitlab-data.uuid
      /usr/local/sbin/check-gitlab-disk
      install -d -m 0700 /srv/gitlab/config
      install -d -m 0755 /srv/gitlab/data /srv/gitlab/logs
      install -d -m 0755 /etc/systemd/system/docker.service.d
      cat > /etc/systemd/system/docker.service.d/gitlab-data.conf <<'UNIT'
      [Unit]
      RequiresMountsFor=/srv/gitlab
      After=srv-gitlab.mount
      [Service]
      ExecStartPre=/usr/local/sbin/check-gitlab-disk
      UNIT
      systemctl daemon-reload
runcmd:
  - [systemctl, enable, --now, docker]
  - [/usr/local/sbin/prepare-gitlab-disk]
