name: Load test gate

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: Azure Load Testing test ID to run
        required: true
        default: contoso-bank-pr-gate
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'loadtests/**'
      - '.github/workflows/loadtest.yml'

permissions:
  id-token: write
  contents: read

env:
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}

jobs:
  loadtest:
    name: Run Azure Load Testing gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC federated credential)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure demo resources
        id: azure
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${AZURE_ENV_NAME}" ]; then
            echo "::error title=Missing AZURE_ENV_NAME::Set repository variable AZURE_ENV_NAME."
            exit 1
          fi

          resource_group=$(az group list \
            --query "[?tags.\"azd-env-name\"=='${AZURE_ENV_NAME}'].name | [0]" \
            -o tsv)

          if [ -z "$resource_group" ] || [ "$resource_group" = "None" ]; then
            resource_group="rg-${AZURE_ENV_NAME}"
          fi

          load_test_resource=$(az resource list \
            --resource-group "$resource_group" \
            --resource-type "Microsoft.LoadTestService/loadTests" \
            --query "[0].name" \
            -o tsv)

          api_hostname=$(az resource list \
            --resource-group "$resource_group" \
            --resource-type "Microsoft.Web/sites" \
            --tag azd-service-name=api \
            --query "[0].properties.defaultHostName" \
            -o tsv)

          if [ -z "$load_test_resource" ] || [ "$load_test_resource" = "None" ]; then
            echo "::error title=Load Testing resource not found::No Microsoft.LoadTestService/loadTests resource found in $resource_group."
            exit 1
          fi

          if [ -z "$api_hostname" ] || [ "$api_hostname" = "None" ]; then
            echo "::error title=API app not found::No App Service tagged azd-service-name=api found in $resource_group."
            exit 1
          fi

          if ! az extension show --name load --only-show-errors >/dev/null 2>&1; then
            az extension add --name load --only-show-errors
          fi

          {
            echo "resource_group=$resource_group"
            echo "load_test_resource=$load_test_resource"
            echo "api_base_url=https://$api_hostname"
          } >> "$GITHUB_OUTPUT"

      - name: Select load test definition
        id: selected
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            requested='${{ inputs.test_id }}'
          else
            requested='contoso-bank-pr-gate'
          fi

          override=''
          case "$requested" in
            contoso-bank-pr-gate)
              config='loadtests/config/pr-gate.yaml'
              ;;
            contoso-bank-peak-load)
              config='loadtests/config/peak-load.yaml'
              ;;
            contoso-bank-peak-load-locust)
              config='loadtests/config/peak-load-locust.yaml'
              ;;
            contoso-bank-url-smoke)
              config='loadtests/config/url-smoke.yaml'
              ;;
            contoso-bank-url-curl)
              config='loadtests/config/url-curl.yaml'
              ;;
            contoso-bank-url-basic)
              config='loadtests/config/url-basic.yaml'
              ;;
            contoso-bank-url-false-green)
              config='loadtests/config/url-false-green.yaml'
              ;;
            contoso-bank-secrets-kv)
              config='loadtests/config/secrets-demo.yaml'
              ;;
            contoso-bank-secrets-gh)
              config='loadtests/config/secrets-demo.yaml'
              override='{"testId":"contoso-bank-secrets-gh","displayName":"Contoso Bank - GitHub Secret Pipeline","description":"Runs the secrets JMeter script with API_KEY supplied by GitHub Actions."}'
              ;;
            *)
              echo "::error title=Unknown test_id::$requested is not mapped in .github/workflows/loadtest.yml."
              exit 1
              ;;
          esac

          {
            echo "test_id=$requested"
            echo "config_file=$config"
            echo "override_parameters=$override"
          } >> "$GITHUB_OUTPUT"

      - name: Run Azure Load Test
        id: run-load-test
        uses: azure/load-testing@v1
        with:
          loadTestConfigFile: ${{ steps.selected.outputs.config_file }}
          loadTestResource: ${{ steps.azure.outputs.load_test_resource }}
          resourceGroup: ${{ steps.azure.outputs.resource_group }}
          loadTestRunName: contoso-${{ github.run_id }}-${{ github.run_attempt }}
          loadTestRunDescription: GitHub Actions run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          outputVariableName: loadTestRun
          overrideParameters: ${{ steps.selected.outputs.override_parameters }}
          secrets: |
            [
              {
                "name": "API_KEY",
                "value": "${{ secrets.DEMO_API_KEY }}"
              }
            ]
          env: |
            [
              {
                "name": "BASE_URL",
                "value": "${{ steps.azure.outputs.api_base_url }}"
              },
              {
                "name": "LOCUST_HOST",
                "value": "${{ steps.azure.outputs.api_base_url }}"
              }
            ]

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadTestResults-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/loadTest
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce load test outcome
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ steps.run-load-test.outputs['loadTestRun.testRunId'] }}
          TEST_ID: ${{ steps.selected.outputs.test_id }}
          LOAD_TEST_RESOURCE: ${{ steps.azure.outputs.load_test_resource }}
          RESOURCE_GROUP: ${{ steps.azure.outputs.resource_group }}
        run: |
          set -euo pipefail

          if [ -z "${RUN_ID:-}" ]; then
            echo "::error title=Load test did not start::The Azure Load Testing action did not return a test run ID."
            exit 1
          fi

          read -r status result < <(az load test-run show \
            --load-test-resource "$LOAD_TEST_RESOURCE" \
            --resource-group "$RESOURCE_GROUP" \
            --test-run-id "$RUN_ID" \
            --query "[status, testResult]" \
            -o tsv | tr '\n' ' ')

          echo "status=$status testResult=$result runId=$RUN_ID"

          case "$status" in
            DONE)
              ;;
            CANCELLED)
              echo "::error title=Load test aborted::AutoStop fired or the run was cancelled. No performance conclusion is available."
              exit 1
              ;;
            *)
              echo "::error title=Load test infrastructure failure::status=$status. The test infrastructure, script, network path or secret configuration failed before a performance conclusion was available."
              exit 1
              ;;
          esac

          # The aggregate testResult field lags. Measured on run
          # verify-cutover-20260830-163946: still NOT_APPLICABLE more than 60s
          # after status reached DONE, settling to FAILED only later. The
          # per-criterion results, however, were already correct and complete in
          # the first DONE response. So derive the verdict from the criteria and
          # treat testResult as advisory.
          for attempt in 1 2 3 4 5 6; do
            [ "$result" = "NOT_APPLICABLE" ] || break
            echo "testResult=NOT_APPLICABLE; re-querying after 10s to let the aggregate settle ($attempt/6)."
            sleep 10
            result=$(az load test-run show \
              --load-test-resource "$LOAD_TEST_RESOURCE" \
              --resource-group "$RESOURCE_GROUP" \
              --test-run-id "$RUN_ID" \
              --query "testResult" \
              -o tsv)
          done

          criteria_json=$(az load test-run show \
            --load-test-resource "$LOAD_TEST_RESOURCE" \
            --resource-group "$RESOURCE_GROUP" \
            --test-run-id "$RUN_ID" \
            --query "passFailCriteria.passFailMetrics" \
            -o json) || criteria_json=""

          # An absent field can come back as the literal null or as nothing at
          # all. jq copes with null; it errors on empty input.
          [ -n "$criteria_json" ] || criteria_json="null"

          criteria_total=$(printf '%s' "$criteria_json" | jq 'if . == null then 0 else (to_entries | length) end')
          criteria_failed=$(printf '%s' "$criteria_json" | jq '[ (. // {}) | to_entries[] | select(.value.result == "failed") ] | length')

          echo "criteria: total=$criteria_total failed=$criteria_failed (advisory testResult=$result)"

          if [ "$criteria_total" -eq 0 ]; then
            echo "::notice title=Criteria-less teaching artefact::$TEST_ID has no failureCriteria, so the run is informational only. This is the false green described in docs/07."
            exit 0
          fi

          if [ "$criteria_failed" -gt 0 ]; then
            printf '%s' "$criteria_json" \
              | jq -r 'to_entries[] | select(.value.result == "failed") | "  breached: \(.value.aggregate)(\(.value.clientMetric)) \(.value.condition) \(.value.value) — actual \(.value.actualValue)"'
            echo "::error title=Performance regression::$criteria_failed of $criteria_total fail criteria breached. Open the Azure Load Testing run or the loadTestResults artifact for details."
            exit 1
          fi

          echo "Load test passed with $criteria_total criteria enforced."
