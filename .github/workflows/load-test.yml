# =============================================================================
# Contoso Bank - Performance gate
# =============================================================================
# Two jobs, deliberately separated:
#
#   pr-gate      Runs on every pull request. Small, fast, cheap (~0.02 VUH).
#                Its job is to answer "is this change slower than baseline?"
#                and block the merge if it is.
#
#   peak-load    Runs nightly and on demand. Large (1,000 VUs), expensive.
#                Its job is capacity assurance, not gatekeeping.
#
# Auth is OIDC federated credentials - there is no service principal secret
# stored in GitHub, which is the first question an FSI security team will ask.
#
# One-time setup (see docs/08):
#   1. Create an Entra app registration with a federated credential for this repo.
#   2. Grant it "Load Test Contributor" on the load testing resource
#      and "Reader" on the resource group.
#   3. Set repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#      Set repo variables: LOAD_TEST_RESOURCE, LOAD_TEST_RESOURCE_GROUP, API_HOSTNAME
# =============================================================================

name: Performance gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'loadtests/**'
      - '.github/workflows/load-test.yml'
  schedule:
    # 02:00 UTC nightly - the peak-load run.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      testProfile:
        description: Which load profile to run
        required: true
        default: pr-gate
        type: choice
        options:
          - pr-gate
          - peak-load

permissions:
  # OIDC token issuance. This is what removes the need for a stored secret.
  id-token: write
  contents: read
  # Needed to post the results summary back onto the pull request.
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # PR GATE - fast regression check on every pull request
  # ---------------------------------------------------------------------------
  pr-gate:
    name: PR performance gate
    if: github.event_name == 'pull_request' || inputs.testProfile == 'pr-gate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Pre-flight: refuse to spend VUH on a test that cannot fail.
      # ---------------------------------------------------------------------
      # A config without failureCriteria completes with testResult =
      # NOT_APPLICABLE - a green tick even if 100% of requests errored.
      # Catching it here costs nothing and takes a whole class of silent
      # failure off the table. See docs/07 section 7.2 and docs/08 section 8.6a.
      # ---------------------------------------------------------------------
      - name: Pre-flight - every test config must define fail criteria
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          for f in loadtests/config/*.yaml; do
            # Files prefixed with _ are scratch configs generated by
            # tools/e2e-test.ps1 (which deliberately builds a criteria-less
            # config to demonstrate the NOT_APPLICABLE trap). They are cleaned
            # up automatically; skip them rather than failing the gate if a
            # local run was interrupted.
            case "$(basename "$f")" in
              _*) continue ;;
              url-basic.yaml)
                # Opening no-code demo: intentionally criteria-less so doc 07 can
                # contrast NOT_APPLICABLE with a real application pass/fail.
                continue
                ;;
              url-false-green.yaml)
                # Doc 06 §6.4a false-green demo: intentionally criteria-less and
                # expected to produce DONE / NOT_APPLICABLE at ~100% errors.
                continue
                ;;
            esac
            if ! grep -q '^failureCriteria:' "$f"; then
              echo "::error file=$f,title=No fail criteria::$f defines no failureCriteria block. A test without criteria always reports NOT_APPLICABLE and can never fail, even at a 100% error rate."
              rc=1
            fi
          done
          exit $rc

      - name: Azure login (OIDC federated credential)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Point the test at the right environment without editing the YAML.
      # env entries in the config file are overridable from the action.
      - name: Run Azure Load Test (PR gate)
        id: loadtest
        uses: azure/load-testing@v1
        with:
          loadTestConfigFile: loadtests/config/pr-gate.yaml
          loadTestResource: ${{ vars.LOAD_TEST_RESOURCE }}
          resourceGroup: ${{ vars.LOAD_TEST_RESOURCE_GROUP }}
          env: |
            [
              {
                "name": "BASE_URL",
                "value": "${{ vars.API_HOSTNAME }}"
              }
            ]

      # Always upload, even on failure - the failing run is the interesting one.
      - name: Publish load test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results-pr-${{ github.event.pull_request.number || github.run_id }}
          path: ${{ github.workspace }}/loadTest
          retention-days: 30

  # ---------------------------------------------------------------------------
  # PEAK LOAD - nightly capacity assurance, 1,000 virtual users
  # ---------------------------------------------------------------------------
  peak-load:
    name: Nightly peak load
    if: github.event_name == 'schedule' || inputs.testProfile == 'peak-load'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC federated credential)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Azure Load Test (peak load)
        uses: azure/load-testing@v1
        with:
          loadTestConfigFile: loadtests/config/peak-load.yaml
          loadTestResource: ${{ vars.LOAD_TEST_RESOURCE }}
          resourceGroup: ${{ vars.LOAD_TEST_RESOURCE_GROUP }}
          env: |
            [
              {
                "name": "BASE_URL",
                "value": "${{ vars.API_HOSTNAME }}"
              }
            ]

      - name: Publish load test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results-nightly-${{ github.run_id }}
          path: ${{ github.workspace }}/loadTest
          retention-days: 90
