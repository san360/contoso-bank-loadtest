name: Infrastructure CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - 'loadtests/config/*.yaml'
      - 'tools/provision_loadtests.ps1'
      - 'tools/provision_loadtests.sh'
      - '.github/workflows/infra-ci.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'loadtests/config/*.yaml'
      - 'tools/provision_loadtests.ps1'
      - 'tools/provision_loadtests.sh'
      - '.github/workflows/infra-ci.yml'

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform and provisioning checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform init without backend
        run: terraform -chdir=infra init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra validate

      - name: Lint POSIX provisioning hook
        run: bash -n tools/provision_loadtests.sh

      - name: Parse PowerShell provisioning hook
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/provision_loadtests.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber) $($_.Message)"
            }
            exit 1
          }

      - name: Pre-flight load test failure criteria
        shell: bash
        run: |
          set -euo pipefail

          rc=0
          for file in loadtests/config/*.yaml; do
            case "$(basename "$file")" in
              url-basic.yaml|url-false-green.yaml)
                echo "Allowed criteria-less teaching artefact: $file"
                continue
                ;;
            esac

            if ! grep -Eq '^[[:space:]]*failureCriteria[[:space:]]*:' "$file"; then
              echo "::error file=$file,title=Missing failureCriteria::$file must declare failureCriteria. Only url-basic.yaml and url-false-green.yaml are allowed to omit it."
              rc=1
            fi
          done

          exit "$rc"
