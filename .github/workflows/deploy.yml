name: Deploy Azure demo

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZD_NON_INTERACTIVE: 'true'
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: 'true'
  TF_VAR_demo_api_key_value: ${{ secrets.DEMO_API_KEY }}

jobs:
  deploy:
    name: azd provision and deploy
    runs-on: ubuntu-latest
    environment: contoso-demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove local Python virtual environment before packaging
        run: rm -rf src/.venv

      - name: Azure login (OIDC federated credential)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Authenticate azd with GitHub OIDC
        run: |
          azd auth login \
            --client-id "$ARM_CLIENT_ID" \
            --tenant-id "$AZURE_TENANT_ID" \
            --federated-credential-provider github

      - name: Select azd environment
        run: |
          if [ -z "${AZURE_ENV_NAME}" ] || [ -z "${AZURE_LOCATION}" ]; then
            echo "::error title=Missing azd variables::Set repository variables AZURE_ENV_NAME and AZURE_LOCATION."
            exit 1
          fi

          azd env new "$AZURE_ENV_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION"

      - name: Provision Azure infrastructure
        run: azd provision --no-prompt

      - name: Deploy API and provision load test definitions
        run: azd deploy --no-prompt
