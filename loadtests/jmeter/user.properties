# JMeter properties for the Contoso Bank load test.
#
# Referenced from the YAML config as:
#   properties:
#     userPropertyFile: user.properties
#
# Every value here is read by the JMX via ${__P(name,default)}, so the same
# unmodified test plan runs as a 5-user PR gate or a 5,000-user peak test.
# Change the numbers, not the script.

# ---- Load profile -------------------------------------------------------
# Virtual users PER ENGINE. Total VUs = threads x engineInstances.
# Keep at or below 250 to stay within the guidance for a Standard_D4d_v4 engine.
threads=50

# Ramp-up in seconds. Never ramp instantly: you want to see the knee in the
# response-time curve, not a wall.
rampup=60

# Total test duration in seconds, measured from the start of ramp-up.
duration=300

# ---- Scenario tuning ----------------------------------------------------
# Page size for the transaction history call. This is the dial that makes the
# N+1 query bottleneck dramatic: at page_size=50 the app issues 51 queries.
pageSize=20

# Customer think time in milliseconds (plus up to 500ms of random jitter).
# Set to 0 for a stress test where you deliberately want to find the ceiling.
thinkTimeMs=500

# ---- JMeter engine tuning ----------------------------------------------
# Keep the engines honest. Azure Load Testing considers an engine healthy when
# CPU and memory both stay below 75%; these settings reduce engine-side overhead
# so you measure the application under test, not the load generator.
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.samplerData=false
jmeter.save.saveservice.requestHeaders=false
jmeter.save.saveservice.responseHeaders=false
jmeter.save.saveservice.assertion_results_failure_message=true

# Connection reuse. Retail banking clients are keep-alive; modelling them as
# fresh connections inflates latency and understates your real capacity.
httpclient4.retrycount=0
hc.parameters.file=hc.parameters
