# Locust runtime configuration for the Contoso Bank load test.
#
# Referenced from the YAML config as:
#   properties:
#     userPropertyFile: locust.conf
#
# Azure Load Testing runs Locust in headless mode and distributes `users` across
# the engines you requested. With engineInstances: 4 and users = 250, you get
# 1,000 virtual users in total - the same figure as the JMX peak-load test, so
# the two runs are directly comparable.
#
# Engine runtime observed on 2026-09-15: Locust 2.46.4 (the documented 2.33.2 is
# out of date). Keep this file to options that are valid in current Locust: an
# unrecognised key here is parsed as a User class name and kills every engine at
# start-up with "Unknown User(s)", which surfaces as a bare status=FAILED run.

locustfile = locustfile.py

# Virtual users PER ENGINE.
users = 250

# How quickly new users are spawned, per engine. Ramping matters: spawn all 250
# instantly and you measure a thundering herd, not a customer arrival pattern.
spawn-rate = 5

# Total run time. Accepts Locust duration syntax (300s, 15m, 1h).
run-time = 15m

# Required. Locust needs an explicit target when running headless.
host = https://app-loadtest-27d2e5.azurewebsites.net

headless = true

# NOTE: there is deliberately no `percentiles-to-statistics` here.
#
# It is not a Locust CLI/config option - it is a Python module variable
# (locust.stats.PERCENTILES_TO_STATISTICS). Locust 2.46.4 on the engines treats
# the unknown key as a positional User class name and exits immediately:
#   ERROR/locust.main: Unknown User(s): --percentiles-to-statistics=0.5, 0.9, ...
# That killed all four engines on run contoso-bank-peak-load-locust-20260915-112539.
# Azure Load Testing computes p90/p95/p99 for the dashboard from the results
# itself, so nothing is lost by leaving it out.

# Keep engine-side logging light so you measure the app, not the load generator.
loglevel = WARNING
