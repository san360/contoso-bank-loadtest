# Locust counterpart of secrets-demo.yaml; the original JMX is unchanged.
# Azure Load Testing resolves API_KEY with the load test resource's managed
# identity and exposes the value to Locust as an environment variable.
# That identity needs Key Vault Secrets User and network access to the vault.
# This demonstrates secret transport, not application-side authentication.
version: v0.1

testId: contoso-bank-secrets-kv-locust
displayName: Contoso Bank - Key Vault Secrets (Locust)
description: Locust demo of managed-identity Key Vault secret resolution and secret-header requests.

testType: Locust
testPlan: ../locust/secrets_locustfile.py
engineInstances: 1

properties:
  userPropertyFile: ../locust/secrets.conf

# One engine, five users total; no CSV data or additional Python modules.
env:
  - name: LOCUST_HOST
    value: https://app-loadtest-27d2e5.azurewebsites.net
  - name: LOCUST_USERS
    value: "5"
  - name: LOCUST_SPAWN_RATE
    value: "0.3333333333333333"
  # Azure requires integer seconds here, not Locust's "60s" duration syntax.
  - name: LOCUST_RUN_TIME
    value: "60"
  - name: accountId
    value: ACC-1001
  # Only enable for a disposable demo value; plaintext persists in worker logs.
  - name: DEMO_LOG_SECRET
    value: "false"

secrets:
  - name: API_KEY
    value: https://kv-loadtest-27d2e5.vault.azure.net/secrets/demo-api-key

failureCriteria:
  clientMetrics:
    - avg(response_time_ms) > 500
    - percentage(error) > 5
    - GetBalanceWithSecretHeader: p95(response_time_ms) > 800
    - HealthCheckWithSecretHeader: p95(response_time_ms) > 500
    - SecretResolutionCheck: percentage(error) > 0

autoStop:
  errorPercentage: 90
  timeWindow: 60
