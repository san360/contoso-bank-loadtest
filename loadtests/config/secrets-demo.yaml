# =============================================================================
# Contoso Bank - KEY VAULT SECRETS DEMO
# =============================================================================
# Small, cheap and deliberately boring from a load perspective. This test exists
# to prove the secret-handling mechanism, not to find the application's ceiling.
#
# What is stored where:
#   * This YAML stores ordinary, non-secret parameters in `env` (target host,
#     thread count, ramp-up, duration and demo account id).
#   * This YAML stores only the Key Vault secret URI for `API_KEY`.
#   * The secret value itself lives only in Azure Key Vault.
#   * The JMX reads it with ${__GetSecret(API_KEY)} from a User Defined Variables
#     element and sends the resulting ${udv_apiKey} as an Authorization header.
#
# Placement rule that is easy to get wrong:
#   Azure Load Testing rejects __GetSecret when it is evaluated inside a sampler
#   or a listener. Calling it directly from an HTTP Header Manager value counts,
#   because that value is resolved on every request. The engine then logs
#   "__GetSecret function is not allowed in a sampler or a listener" for each
#   request, the header goes out unresolved, and the run can still finish green
#   against an API that does not validate the header. Resolve the secret once in
#   a User Defined Variables element and reference the variable everywhere else.
#
# Resolution path:
#   Azure Load Testing engine -> load test resource managed identity -> Key Vault.
#
# The single most commonly missed step is RBAC: the load test resource's managed
# identity must have Key Vault Secrets User on the vault. If that role assignment
# is absent, the run fails later with a confusing runtime secret-resolution error
# instead of an obvious permissions error at test creation time.
#
# The Contoso Bank API does not currently validate this Authorization header.
# That is intentional for the demo: successful requests prove that the test can
# resolve and send a secret, not that the application implements authentication.
#
# Run it:
#   az load test create \
#     --load-test-resource $ALT_RESOURCE --resource-group $RG \
#     --test-id contoso-bank-secrets-kv \
#     --load-test-config-file loadtests/config/secrets-demo.yaml
# =============================================================================

version: v0.1

testId: contoso-bank-secrets-kv
displayName: Contoso Bank - Key Vault Secrets
description: Demonstrates Azure Load Testing resolving a Key Vault secret by managed identity at run time.

testType: JMX
testPlan: ../jmeter/contoso-bank-secrets.jmx

# One small engine is enough. This is a secrets/RBAC demo, not a scale test.
engineInstances: 1

properties:
  userPropertyFile: ../jmeter/user.properties

env:
  - name: BASE_URL
    value: app-loadtest-27d2e5.azurewebsites.net
  - name: threads
    value: "5"
  - name: rampup
    value: "15"
  - name: duration
    value: "60"
  - name: accountId
    value: ACC-1001

secrets:
  - name: API_KEY
    value: https://kv-loadtest-27d2e5.vault.azure.net/secrets/demo-api-key

failureCriteria:
  clientMetrics:
    - avg(response_time_ms) > 500
    - percentage(error) > 5
    - GetBalanceWithSecretHeader: p95(response_time_ms) > 800
    - HealthCheckWithSecretHeader: p95(response_time_ms) > 500
    # Without this, a secret that never resolved is invisible: the check runs once
    # per thread, so a handful of failures would be rounded away by the aggregate
    # error criterion above. Scoped to the sampler, any failure fails the run.
    - SecretResolutionCheck: percentage(error) > 0

autoStop:
  errorPercentage: 90
  timeWindow: 60
