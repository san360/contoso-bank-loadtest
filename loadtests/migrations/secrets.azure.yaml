version: v0.1
testId: contoso-bank-secrets-jmx-migrated
displayName: Contoso Bank - Secrets JMX Migration
description: Secrets demo with a once-per-user check and guarded unresolved credentials.
testType: Locust
testPlan: secrets_locustfile.py
engineInstances: 1
configurationFiles:
  - jmeter_runtime.py
properties:
  userPropertyFile: secrets.azure.conf
env:
  - name: BASE_URL
    value: app-loadtest-27d2e5.azurewebsites.net
  - name: LOCUST_HOST
    value: https://app-loadtest-27d2e5.azurewebsites.net
  - name: LOCUST_USERS
    value: "5"
  - name: LOCUST_SPAWN_RATE
    value: "0.3333333333333333"
  - name: LOCUST_RUN_TIME
    value: "60"
  - name: ACCOUNT_ID
    value: ACC-1001
  - name: DEMO_LOG_SECRET
    value: "false"
secrets:
  - name: API_KEY
    value: https://kv-loadtest-27d2e5.vault.azure.net/secrets/demo-api-key
failureCriteria:
  clientMetrics:
    - avg(response_time_ms) > 500
    - percentage(error) > 5
    - GetBalanceWithSecretHeader: p95(response_time_ms) > 800
    - HealthCheckWithSecretHeader: p95(response_time_ms) > 500
    - SecretResolutionCheck: percentage(error) > 0
autoStop:
  errorPercentage: 90
  timeWindow: 60
